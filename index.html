<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>當舖台帳管理系統 (分頁版)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 20px; background: #f9f9f9; }
    h1 { margin: 0 0 10px; color: #333; }
    .muted { opacity: 0.7; font-size: 13px; margin-bottom: 10px; line-height: 1.6; background: #eee; padding: 10px; border-radius: 8px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 15px 0; }
    input, select, button { padding: 8px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 13px; }
    th { background: #f1f1f1; }
    td.num { text-align: right; }
    .danger { background: #fff5f5; color: #c00; border-color: #f0b4b4; }
    .primary { background: #111; color: #fff; }
    .ghost { background: #fff; }
    .gridSummary { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
    .card { border:1px solid #ddd; border-radius: 12px; padding: 10px 12px; background: white; }
    .card .k { font-size:12px; opacity:.7; }
    .card .v { font-size:18px; font-weight:800; margin-top:4px; color: #f53939; }
    
    /* 分頁與搜尋樣式 */
    .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
    .pagination-controls { display: flex; gap: 5px; align-items: center; }
    .search-box { width: 250px; background: #fffbe6; }
    
    input[type="date"] { width: 130px; }
    .item-input { width: 120px; }
    .sn-input { width: 80px; font-weight: bold; }
    .note-input { width: 120px; }
  </style>
</head>
<body>
  <h1>當舖台帳系統</h1>
  <div class="muted">
    <b>規則：</b> 5日(含)內算 0.5 期；超過 5 日按原規則 (15日調校法)。<br/>
  </div>

  <div class="row">
    <input id="filename" value="pawn_ledger_2026" style="width: 150px" />
    <select id="currency"><option>MMK</option><option>THB</option><option>USD</option></select>
    <label>利率 %：<input id="rate" type="number" step="0.1" value="4" style="width: 60px" /></label>
    
    <button class="primary" id="addRowBtn">+ 新增 (自動編號)</button>
    <button class="ghost" id="exportBtn">匯出 XLSX</button>
    <button class="ghost" id="saveJsonBtn">備份 JSON</button>
    <button class="ghost" id="loadJsonBtn">導入 JSON</button>
    <input type="file" id="fileInput" style="display:none" accept=".json" />
    <button class="danger" id="clearBtn" style="margin-left: auto;">清空所有</button>
  </div>

  <div class="gridSummary">
    <div class="card"><div class="k">累計現金流</div><div class="v" id="sumCashflow">0</div></div>
    <div class="card"><div class="k">已實現損益</div><div class="v" id="sumRealized">0</div></div>
    <div class="card"><div class="k">未實現利息</div><div class="v" id="sumUnrealized">0</div></div>
    <div class="card"><div class="k">總應收帳款</div><div class="v" id="sumReceivable">0</div></div>
  </div>

  <div class="nav-row">
    <input type="text" id="searchInput" class="search-box" placeholder="搜尋編號、品名或備註..." />
    <div class="pagination-controls">
      <span>每頁顯示:</span>
      <select id="pageSize" style="padding: 2px;">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
      </select>
      <button class="ghost" id="prevPage">上一頁</button>
      <span id="pageInfo">第 1 / 1 頁</span>
      <button class="ghost" id="nextPage">下一頁</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>典當日期</th><th>贖回日期</th><th>當品編號</th><th>當品名稱</th><th>本金</th>
        <th>天數</th><th>期數</th><th>利息</th><th>應收</th><th>現金流</th>
        <th>備註</th><th>操作</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    let allData = []; // 存儲所有原始數據
    let currentPage = 1;
    let itemsPerPage = 10;

    const tbody = document.getElementById('tbody');
    const currencyEl = document.getElementById('currency');
    const rateEl = document.getElementById('rate');

    function calcPeriods(days) {
      if (days <= 0) return 0;
      if (days <= 5) return 0.5;
      const full = Math.floor(days / 30);
      const rem = days % 30;
      return full + (rem > 15 ? 1 : 0);
    }

    // 將資料渲染到表格（僅渲染當前分頁）
    function renderTable() {
      const ccy = currencyEl.value;
      const rate = Number(rateEl.value) / 100;
      const now = new Date().toISOString().split('T')[0];
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();

      // 過濾數據
      const filteredData = allData.filter(item => 
        item.sn.toLowerCase().includes(searchTerm) || 
        item.item.toLowerCase().includes(searchTerm) || 
        item.note.toLowerCase().includes(searchTerm)
      );

      // 計算總計（基於過濾後的數據，或是全部數據？通常統計是看全體）
      let sums = { cash: 0, real: 0, unreal: 0, recv: 0 };
      allData.forEach(d => {
        const endDate = d.redeemDate || now;
        const days = d.pawnDate ? Math.max(0, Math.floor((new Date(endDate) - new Date(d.pawnDate))/86400000)) : 0;
        const princ = Number(d.principal) || 0;
        const interest = princ * rate * calcPeriods(days);
        const isDone = !!d.redeemDate;
        sums.cash += (-princ + (isDone ? princ + interest : 0));
        if(isDone) sums.real += interest; else { sums.unreal += interest; sums.recv += (princ + interest); }
      });

      document.getElementById('sumCashflow').textContent = `${sums.cash.toLocaleString()} ${ccy}`;
      document.getElementById('sumRealized').textContent = `${sums.real.toLocaleString()} ${ccy}`;
      document.getElementById('sumUnrealized').textContent = `${sums.unreal.toLocaleString()} ${ccy}`;
      document.getElementById('sumReceivable').textContent = `${sums.recv.toLocaleString()} ${ccy}`;

      // 分頁計算
      const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      document.getElementById('pageInfo').textContent = `第 ${currentPage} / ${totalPages} 頁`;

      const start = (currentPage - 1) * itemsPerPage;
      const paginatedData = filteredData.slice(start, start + itemsPerPage);

      tbody.innerHTML = '';
      paginatedData.forEach((data, index) => {
        const globalIndex = start + index; // 對應到 filteredData 的索引
        const actualIndex = allData.indexOf(filteredData[globalIndex]); // 對應到 allData 的索引

        const tr = document.createElement('tr');
        const endDate = data.redeemDate || now;
        const days = data.pawnDate ? Math.max(0, Math.floor((new Date(endDate) - new Date(data.pawnDate))/86400000)) : 0;
        const periods = calcPeriods(days);
        const princ = Number(data.principal) || 0;
        const interest = princ * rate * periods;
        const total = princ + interest;
        const isDone = !!data.redeemDate;
        const cf = -princ + (isDone ? total : 0);

        tr.innerHTML = `
          <td><input type="date" value="${data.pawnDate}" onchange="updateData(${actualIndex}, 'pawnDate', this.value)"></td>
          <td><input type="date" value="${data.redeemDate}" onchange="updateData(${actualIndex}, 'redeemDate', this.value)"></td>
          <td><input class="sn sn-input" value="${data.sn}" oninput="updateData(${actualIndex}, 'sn', this.value)"></td>
          <td><input class="item item-input" value="${data.item}" oninput="updateData(${actualIndex}, 'item', this.value)"></td>
          <td>
    <input type="number" class="principal" 
      value="${data.principal}" 
      style="width:90px; padding: 5px;" 
      oninput="allData[${actualIndex}].principal = this.value" 
      onblur="renderTable()"
      onkeydown="if(event.key==='Enter') renderTable()">
  </td><td class="num">${days}</td>
          <td class="num">${periods}</td>
          <td class="num">${interest.toLocaleString()}</td>
          <td class="num">${total.toLocaleString()}</td>
          <td class="num">${cf.toLocaleString()}</td>
          <td><input class="note note-input" value="${data.note}" oninput="updateData(${actualIndex}, 'note', this.value)"></td>
          <td><button class="danger" onclick="deleteData(${actualIndex})">刪除</button></td>
        `;
        tbody.appendChild(tr);
      });
      saveToLocal();
    }

    function updateData(index, field, value) {
      allData[index][field] = value;
      renderTable();
    }

    function deleteData(index) {
      if(confirm('確定刪除此筆資料？')) {
        allData.splice(index, 1);
        renderTable();
      }
    }

    function addRow() {
      let newSn = '1001';
      let lastPawnDate = new Date().toISOString().split('T')[0];
      let lastItem = '';
      let lastPrincipal = 0;

      if (allData.length > 0) {
        const last = allData[allData.length - 1];
        lastPawnDate = last.pawnDate;
        lastItem = last.item;
        lastPrincipal = last.principal;
        
        const match = last.sn.match(/(\d+)$/);
        if (match) {
          const num = parseInt(match[1], 10) + 1;
          newSn = last.sn.substring(0, last.sn.length - match[1].length) + num;
        } else {
          newSn = last.sn;
        }
      }

      allData.push({
        pawnDate: lastPawnDate,
        redeemDate: '',
        sn: newSn,
        item: lastItem,
        principal: lastPrincipal,
        note: ''
      });
      
      // 新增後跳到最後一頁
      currentPage = Math.ceil(allData.length / itemsPerPage);
      renderTable();
    }

    // 儲存與讀取
    function saveToLocal() {
      localStorage.setItem('pawn_data_v3', JSON.stringify({
        currency: currencyEl.value,
        rate: rateEl.value,
        rows: allData
      }));
    }

    function loadFromLocal() {
      const saved = JSON.parse(localStorage.getItem('pawn_data_v3'));
      if (saved) {
        currencyEl.value = saved.currency || 'MMK';
        rateEl.value = saved.rate || 4;
        allData = saved.rows || [];
      }
      if (allData.length === 0) addRow();
      renderTable();
    }

    // 分頁控制事件
    document.getElementById('prevPage').onclick = () => { if(currentPage > 1) { currentPage--; renderTable(); } };
    document.getElementById('nextPage').onclick = () => { 
      const totalPages = Math.ceil(allData.length / itemsPerPage);
      if(currentPage < totalPages) { currentPage++; renderTable(); } 
    };
    document.getElementById('pageSize').onchange = (e) => { itemsPerPage = parseInt(e.target.value); currentPage = 1; renderTable(); };
    document.getElementById('searchInput').oninput = () => { currentPage = 1; renderTable(); };

    // 其他按鈕事件
    document.getElementById('addRowBtn').onclick = addRow;
    document.getElementById('clearBtn').onclick = () => { if(confirm('確定清空？')) { allData = []; addRow(); } };
    document.getElementById('saveJsonBtn').onclick = () => {
      const blob = new Blob([localStorage.getItem('pawn_data_v3')], {type: "application/json"});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${document.getElementById('filename').value}.json`;
      a.click();
    };
    document.getElementById('loadJsonBtn').onclick = () => document.getElementById('fileInput').click();
    document.getElementById('fileInput').onchange = (e) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        localStorage.setItem('pawn_data_v3', event.target.result);
        loadFromLocal();
      };
      reader.readAsText(e.target.files[0]);
    };
    document.getElementById('exportBtn').onclick = () => {
      const wb = XLSX.utils.book_new();
      // 注意：匯出會匯出「所有」數據，而不僅是當前分頁
      const ws = XLSX.utils.json_to_sheet(allData);
      XLSX.utils.book_append_sheet(wb, ws, "台帳全紀錄");
      XLSX.writeFile(wb, `${document.getElementById('filename').value}.xlsx`);
    };

    currencyEl.onchange = renderTable;
    rateEl.oninput = renderTable;

    loadFromLocal();
  </script>
</body>
</html>
